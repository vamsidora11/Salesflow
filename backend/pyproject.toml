[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salesflow-backend"
version = "0.1.0"
description = "Real-time sales analytics platform: API, stream consumer and workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "redis>=5.2",
    "confluent-kafka>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "xlsxwriter>=3.2",
    "boto3>=1.35",
    "prometheus-client>=0.21",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "openpyxl>=3.1",
    "testcontainers[postgres,kafka,redis]>=4.8",
    "locust>=2.32",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "confluent_kafka.*", "celery.*", "boto3.*", "botocore.*", "xlsxwriter.*", "testcontainers.*", "openpyxl.*", "locust.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis.*", "app.realtime.pubsub"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["app.tasks.jobs"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
